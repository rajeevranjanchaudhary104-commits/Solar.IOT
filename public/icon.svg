<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="wiperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Glowing Sun in top corner -->
  <circle cx="370" cy="142" r="54" fill="url(#sunGrad)" filter="url(#glow)"/>
  <g stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="370" y1="62" x2="370" y2="76" />
    <line x1="370" y1="208" x2="370" y2="222" />
    <line x1="290" y1="142" x2="304" y2="142" />
    <line x1="436" y1="142" x2="450" y2="142" />
    <line x1="314" y1="86" x2="324" y2="96" />
    <line x1="416" y1="188" x2="426" y2="198" />
    <line x1="314" y1="198" x2="324" y2="188" />
    <line x1="416" y1="96" x2="426" y2="86" />
  </g>

  <!-- Solar Photovoltaic Panel 3D Perspective Base -->
  <polygon points="106,370 406,370 366,220 146,220" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round"/>

  <!-- Panel Internal Grid Lines (Horizontal) -->
  <line x1="133" y1="270" x2="379" y2="270" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>
  <line x1="120" y1="320" x2="392" y2="320" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>

  <!-- Panel Internal Grid Lines (Vertical Perspective) -->
  <line x1="201" y1="220" x2="181" y2="370" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>
  <line x1="256" y1="220" x2="256" y2="370" stroke="#7dd3fc" stroke-width="3" opacity="0.8"/>
  <line x1="311" y1="220" x2="331" y2="370" stroke="#7dd3fc" stroke-width="2.5" opacity="0.7"/>

  <!-- Automated Wiper Blade Sweeping Across the Panel -->
  <g transform="rotate(-22 256 295)">
    <rect x="250" y="195" width="12" height="200" rx="6" fill="url(#wiperGrad)" filter="url(#glow)"/>
    <circle cx="256" cy="385" r="10" fill="#f8fafc" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- IoT Wave / Connectivity Arc Symbol -->
  <path d="M 120 130 A 60 60 0 0 1 170 180" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 100 110 A 90 90 0 0 1 180 190" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <circle cx="155" cy="165" r="5" fill="#34d399"/>

  <!-- Sparkling Clean Star -->
  <path d="M 230 190 Q 240 190 240 180 Q 240 190 250 190 Q 240 190 240 200 Q 240 190 230 190" fill="#fef08a"/>
</svg>
